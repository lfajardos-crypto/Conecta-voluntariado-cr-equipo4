<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Plataforma para visualizar actividades comunitarias en Costa Rica">
    <script src="/Conecta-voluntariado-cr-equipo4/js/data_actividades.js"defer></script>
    <script src="/Conecta-voluntariado-cr-equipo4/js/actividades.js"defer></script>
    <link rel="stylesheet" href="/Conecta-voluntariado-cr-equipo4/css/estilos.css">
    <title>Actividades</title>
</head>
<body>
    <header class="header-principal">
        <p class="marca"><strong>Actividades</strong></p>

        <nav aria-label="Navegación principal" class="navegacion-principal">
            <ul>
                <li><a href="/Conecta-voluntariado-cr-equipo4/html/index.html" >Inicio</a></li>
                <li><a href="/Conecta-voluntariado-cr-equipo4/html/actividades.html"aria-current="page">Actividades</a></li>
                <li><a href="/Conecta-voluntariado-cr-equipo4/html/inscripcion.html">Inscripción</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-actividades">
        <section class="seccion-actividades" aria-labelledby="titulo-lista-actividades">
            <header>
                <h1 id="titulo-lista-actividades">Actividades registradas</h1>
                <p class="subtitulo">Listado de todas las actividades disponibles en el sistema.</p>
            </header>

            <div class="filtro-actividades">
                <label for="filtro-area-tematica">Filtrar por área temática:</label>
                <select id="filtro-area-tematica">
                    <option value="">Todas las áreas</option>
                </select>
            </div>

            <div class="tabla-actividades-contenedor">
                <table class="tabla-actividades">
                    <caption>Lista de actividades registradas</caption>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre de la actividad</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Área temática</th>
                            <th scope="col">Provincia/Cantón</th>
                            <th scope="col">Requisitos</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-actividades"></tbody>
                </table>
            </div>
        </section>
    </main>


    
</body>
</html>
